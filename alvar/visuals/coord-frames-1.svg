<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="monospace">
  <!-- Body frame (left) -->
  <text x="150" y="25" text-anchor="middle" font-size="14" font-weight="bold">BODY FRAME</text>
  
  <!-- Drone nose -->
  <polygon points="150,100 130,160 170,160" fill="#4a9eff" stroke="#222" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="11">Nose (forward)</text>
  
  <!-- Obstacle in body frame -->
  <circle cx="150" cy="60" r="8" fill="#ff4a4a" stroke="#222" stroke-width="2"/>
  <text x="150" y="45" text-anchor="middle" font-size="10" fill="#ff4a4a">Obstacle: 3m "ahead"</text>
  
  <!-- Arrow from drone to obstacle -->
  <line x1="150" y1="100" x2="150" y2="70" stroke="#ff4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Frame axes body -->
  <line x1="80" y1="250" x2="80" y2="200" stroke="#4a9eff" stroke-width="2"/>
  <text x="75" y="195" font-size="10" fill="#4a9eff">Y</text>
  <line x1="80" y1="250" x2="130" y2="250" stroke="#4a9eff" stroke-width="2"/>
  <text x="135" y="255" font-size="10" fill="#4a9eff">X</text>
  <text x="80" y="270" font-size="10">Forward = drone's nose</text>
  
  <!-- World frame (right) -->
  <text x="450" y="25" text-anchor="middle" font-size="14" font-weight="bold">WORLD FRAME</text>
  
  <!-- Ground line -->
  <line x1="350" y1="160" x2="550" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="560" y="164" font-size="10" fill="#888">ground</text>
  
  <!-- Drone tilted up -->
  <polygon points="450,130 420,185 480,185" fill="#4a9eff" stroke="#222" stroke-width="2" transform="rotate(-30, 450, 155)"/>
  <text x="510" y="115" font-size="10">30° pitch up</text>
  
  <!-- Obstacle in world frame (ahead + up) -->
  <circle cx="450" cy="60" r="8" fill="#ff4a4a" stroke="#222" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="10" fill="#ff4a4a">Obstacle: ahead AND up</text>
  
  <!-- Dashed line showing the tilted forward direction -->
  <line x1="450" y1="155" x2="450" y2="70" stroke="#ff4a4a" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Frame axes world -->
  <line x1="380" y1="250" x2="380" y2="200" stroke="#22aa44" stroke-width="2"/>
  <text x="375" y="195" font-size="10" fill="#22aa44">Z (up)</text>
  <line x1="380" y1="250" x2="430" y2="250" stroke="#22aa44" stroke-width="2"/>
  <text x="435" y="255" font-size="10" fill="#22aa44">X (north)</text>
  <text x="380" y="270" font-size="10">Forward = wherever drone points</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4a4a"/>
    </marker>
  </defs>
</svg>
